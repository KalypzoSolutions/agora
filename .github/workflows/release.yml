# Release: pushing a tag v<version> (e.g. v0.1.0) builds, tests and publishes agora-proto to Maven Central
# and the agora-server image to ghcr.io/kalypzosolutions/agora (tags <version> and latest).
# The version comes from the tag (-Pversion overrides gradle.properties); no commit is made.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$VERSION" == *SNAPSHOT ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a release version (expected v<major>.<minor>.<patch>)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pversion="$VERSION"

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral -Pversion="$VERSION" --no-configuration-cache

      - name: Push image to ghcr.io
        run: |
          ./gradlew :agora-server:jib -Pversion="$VERSION" --no-configuration-cache \
            -Djib.to.image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" -Djib.to.tags=latest

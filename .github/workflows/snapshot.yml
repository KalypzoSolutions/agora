# Snapshot: every push to main publishes the current -SNAPSHOT version (gradle.properties) of agora-proto
# to https://central.sonatype.com/repository/maven-snapshots/ and the agora-server image to
# ghcr.io/kalypzosolutions/agora (tags <version>-SNAPSHOT and sha-<commit>).
name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require a -SNAPSHOT version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::gradle.properties version '$VERSION' is not a -SNAPSHOT"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Publish snapshot
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      - name: Push image to ghcr.io
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          ./gradlew :agora-server:jib --no-configuration-cache \
            -Djib.to.image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" -Djib.to.tags="sha-${GITHUB_SHA::7}"
